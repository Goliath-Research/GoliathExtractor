name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN uploads the Pages artifact and requests the deployment identity.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time. Let an in-progress production deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build MkDocs site
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'mkdocs-material>=9.5,<10'
          mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
