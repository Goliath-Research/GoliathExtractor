name: GoliathExtractor release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: Release version when not tagging (SemVer, e.g. 2026.6.1-test)
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build on Ubuntu 22.04 (glibc 2.35) so the dynamically linked
          # binary and bundled libs run on 22.04 and anything newer.
          - arch: amd64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            patchelf \
            libhdf5-dev \
            libhts-dev \
            zlib1g-dev \
            libbz2-dev \
            liblzma-dev \
            libcurl4-gnutls-dev \
            libssl-dev \
            libzstd-dev

      - name: Build
        run: |
          make deps || true
          make clean
          make
          make plugin

      - name: Package tarball
        id: pkg
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.releaseVersion }}" ]]; then
            VERSION="${{ inputs.releaseVersion }}"
          else
            echo "Run from a v* tag or set releaseVersion." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          OUT="${{ runner.temp }}/goliath-extractor-linux-${{ matrix.arch }}.tar.gz"
          bash scripts/package_goliath_extractor.sh \
            --build-dir . \
            --arch "${{ matrix.arch }}" \
            --version "$VERSION" \
            --output "$OUT" \
            --bundle-libs
          tar -tzvf "$OUT"
          sha256sum "$OUT" | tee "${OUT}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: goliath-extractor-linux-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/goliath-extractor-linux-${{ matrix.arch }}.tar.gz
            ${{ runner.temp }}/goliath-extractor-linux-${{ matrix.arch }}.tar.gz.sha256

  smoke:
    # Bare images, no extra packages: every non-glibc lib must come from the
    # tarball. Run via docker on the host so JS actions never run in-container.
    needs: package
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64]
        image: ["ubuntu:22.04", "ubuntu:24.04", "ubuntu:latest", "debian:stable-slim"]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: goliath-extractor-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/artifacts

      - name: Smoke test in ${{ matrix.image }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ runner.temp }}/artifacts:/artifacts:ro" \
            -v "$PWD/scripts:/scripts:ro" \
            "${{ matrix.image }}" \
            sh /scripts/smoke_test_tarball.sh /artifacts/goliath-extractor-linux-${{ matrix.arch }}.tar.gz

  publish:
    needs: [package, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Download arch tarballs
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.releaseVersion }}"
          fi
          TAG="v${VERSION}"
          shopt -s nullglob
          FILES=( "${{ runner.temp }}/artifacts"/goliath-extractor-linux-*.tar.gz* )
          [[ ${#FILES[@]} -gt 0 ]] || { echo "No tarballs to publish"; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              --title "GoliathExtractor ${VERSION}" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY" \
              "${FILES[@]}"
          fi
